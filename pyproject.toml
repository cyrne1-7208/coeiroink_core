[build-system]
requires = [
    "setuptools>=77.0.3,<82",
    "wheel>=0.45,<1",
]
build-backend = "setuptools.build_meta"

[project]
name = "coeirocore"
version = "0.2.2+coeiroink.1.7.3"
description = "COEIROINK Core synthesis library"
requires-python = ">=3.14,<3.15"
license = "LGPL-3.0-only"
license-files = ["LICENSE", "licenses/GPL-3.0.txt", "licenses/SOURCES.md"]
authors = [{ name = "shirowanisan" }]
urls = { Homepage = "https://github.com/cyrne1-7208/coeiroink_core" }
dependencies = [
    # 既存のMYCOEIROINKモデルで使われる、ESPnetのjaconvテキストクリーナー。
    "jaconv>=0.4,<1",
    # ESPnetのjaconvクリーナーが読み込むtacotron_cleanerを提供する。
    "espnet-tts-frontend>=0.0.3,<1",
    "numba>=0.68,<0.69",
    "numpy>=2.3,<2.4",
    "pyopenjtalk @ git+https://github.com/r9y9/pyopenjtalk.git@v0.4.1",
    "pydantic>=2.13,<3",
    "psutil>=7.2,<8",
    "pyworld>=0.3.5,<0.4",
    "pyyaml>=6.0.1,<7",
    "resampy>=0.4.3,<1",
]

[project.optional-dependencies]
# バックエンドごとにPyTorchのwheelが異なるため、extraは一つだけ選択する。
cpu = [
    "espnet @ git+https://github.com/espnet/espnet.git@v.202611",
    # CPUでの周期検出結果を変えないため、バージョンを固定する。
    "praat-parselmouth==0.4.7",
    "scipy>=1.16,<2",
    "torch==2.14.1",
    "torchaudio==2.11.0",
]
cuda = [
    "espnet @ git+https://github.com/espnet/espnet.git@v.202611",
    "torch==2.14.1",
    "torchaudio==2.11.0",
    # CUDA版の音声補正も同じGPU上で実行するためのCUDA 13系バインディング。
    "cupy-cuda13x==14.2.0",
]
directml = [
    "espnet @ git+https://github.com/espnet/espnet.git@v.202611 ; sys_platform == 'win32'",
    "praat-parselmouth==0.4.7; sys_platform == 'win32'",
    "scipy>=1.16,<2; sys_platform == 'win32'",
    "torch==2.14.1; sys_platform == 'win32'",
    "torchaudio==2.11.0; sys_platform == 'win32'",
    "torch-directml-backwards @ https://github.com/cyrne1-7208/torch-directml-backwards/releases/download/v0.2.0.dev261116/torch_directml_backwards-0.2.0.dev261116-2.14.1-cp314-cp314-win_amd64.whl#sha256=a1c2bcc60d209419e25fbcbe0f1278d669d4c43643bf1573d269d83f097538a0 ; sys_platform == 'win32'",
]
opencl = [
    # OpenCLは、LinuxでCUDAを利用できないGPU向けのPrivateUse1バックエンドとして導入する。
    "coeiroink-opencl==0.2.2+coeiroink.1.7.3; sys_platform == 'linux'",
    "espnet @ git+https://github.com/espnet/espnet.git@v.202611 ; sys_platform == 'linux'",
    # ネイティブ拡張と同じTorchをルートextraで選び、CPU版wheelの配布先を指定する。
    "pyopencl>=2026.1.2,<2027; sys_platform == 'linux'",
    "torch==2.14.1; sys_platform == 'linux'",
    "torchaudio==2.11.0; sys_platform == 'linux'",
]
soxr = [
    # 高品質リサンプリングを明示的に選択した環境にのみ導入する。
    "soxr==1.1.0",
]
[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    # 実モデル合成テストが生成波形を検査するために直接使用する。
    "soundfile>=0.14,<1",
]
[tool.uv]
default-groups = []
# Engineと同じlibrosaを使い、音声処理のメジャー更新を避ける。
constraint-dependencies = ["librosa<1"]
# 異なるバックエンドのwheelが同じ環境に入らないよう、各extraを同時に指定できない設定にする。
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
    [
        { extra = "cpu" },
        { extra = "directml" },
    ],
    [
        { extra = "cpu" },
        { extra = "opencl" },
    ],
    [
        { extra = "cuda" },
        { extra = "directml" },
    ],
    [
        { extra = "cuda" },
        { extra = "opencl" },
    ],
    [
        { extra = "directml" },
        { extra = "opencl" },
    ],
]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
# OpenCL拡張は、リポジトリ内のネイティブパッケージから再現可能な形でビルドする。
coeiroink-opencl = [
    { path = "native/opencl", extra = "opencl" },
]
# CPUとOpenCLはCPU wheel、CUDAはcu130 wheelを同じPyTorchバージョンから解決する。
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "opencl" },
    { index = "pytorch-cu130", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "opencl" },
    { index = "pytorch-cu130", extra = "cuda" },
]

[tool.uv.extra-build-dependencies]
# C++拡張のABI不一致を避けるため、OpenCL拡張を実行時に選択されたTorchと同じバージョンでビルドする。
coeiroink-opencl = [
    { requirement = "torch", match-runtime = true },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coeirocore = ["voice_smoothing_kernels/*.cl", "voice_smoothing_kernels/*.h"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["--strict-markers"]
markers = [
    "cuda: CUDAツールキットまたはCuPy/NVRTCを必要とするテスト",
    "opencl: OpenCLランタイムおよびpytorch_oclを必要とするテスト",
    "real_model: 環境変数で指定した実モデルを使用する合成テスト",
]

[tool.ruff]
target-version = "py314"
line-length = 88
