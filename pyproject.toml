[build-system]
requires = [
    "setuptools>=73,<74",
    "wheel>=0.45,<1",
]
build-backend = "setuptools.build_meta"

[project]
name = "coeirocore"
version = "0.1.3+coeiroink.1.7.3"
description = "COEIROINK Core synthesis library"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "shirowanisan" }]
urls = { Homepage = "https://github.com/cyrne1-7208/coeiroink_core" }
dependencies = [
    # ESPnetの依存名をローカルガードへ確実に解決させるため、推移依存にせず明示する。
    "kaldiio==2.18.1+coeiroink.guard1",
    "librosa>=0.11,<1",
    "numba>=0.67,<0.68",
    "numpy>=2.3,<2.4",
    "pyopenjtalk @ git+https://github.com/r9y9/pyopenjtalk.git@v0.4.1",
    "pydantic>=2.13,<3",
    "psutil>=7.2,<8",
    "pyworld>=0.3.5,<0.4",
    "pyyaml>=6.0.1,<7",
    "resampy>=0.4.3,<1",
]

[project.optional-dependencies]
# PyTorch wheelの種類が異なるため、実行環境ではbackend extraを必ず1つだけ選択する。
cpu = [
    "espnet @ git+https://github.com/espnet/espnet.git@v.202604-patch1",
    "torch==2.10.0",
    "torchaudio==2.10.0",
]
cuda = [
    "espnet @ git+https://github.com/espnet/espnet.git@v.202604-patch1",
    "torch==2.10.0",
    "torchaudio==2.10.0",
]
directml = [
    # torch-directmlのWindows wheelに合わせ、DirectMLではTorch 2.4.1を使用する。
    "espnet @ git+https://github.com/espnet/espnet.git@v.202604-patch1 ; sys_platform == 'win32'",
    "torch==2.4.1; sys_platform == 'win32'",
    "torchaudio==2.4.1; sys_platform == 'win32'",
    "torch-directml==0.2.5.dev240914; sys_platform == 'win32'",
]
opencl = [
    # OpenCLはLinuxでCUDAを利用できないGPU向けのPrivateUse1 backendとして個別に導入する。
    "coeiroink-opencl==0.1.3+coeiroink.1.7.3; sys_platform == 'linux'",
    "espnet @ git+https://github.com/espnet/espnet.git@v.202604-patch1 ; sys_platform == 'linux'",
    # native packageの依存メタデータはTorch ABI解決のため空にしているので、Python bindingとその実行時依存は親extraで宣言する。
    "mako>=1.3.10,<2; sys_platform == 'linux'",
    "pyopencl>=2026.1.2,<2027; sys_platform == 'linux'",
    "torch==2.10.0; sys_platform == 'linux'",
    "torchaudio==2.10.0; sys_platform == 'linux'",
]
soxr = [
    # 高品質リサンプリングを明示的に選択した環境にのみ導入する。
    "soxr==1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    # 実モデル合成テストが生成波形を検査するために直接使用する。
    "soundfile>=0.14,<1",
]
build = [
    "patchelf>=0.19,<1; sys_platform == 'linux'",
]

[tool.uv]
default-groups = []
# 異なるbackend wheelを同一環境に混在させないよう、各backend extraを相互排他的にする。
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
    [
        { extra = "cpu" },
        { extra = "directml" },
    ],
    [
        { extra = "cpu" },
        { extra = "opencl" },
    ],
    [
        { extra = "cuda" },
        { extra = "directml" },
    ],
    [
        { extra = "cuda" },
        { extra = "opencl" },
    ],
    [
        { extra = "directml" },
        { extra = "opencl" },
    ],
]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
# ESPnetがTTSでも必須化するkaldiioは、未使用のKaldi I/Oを明示的に拒否するローカルガードへ置き換える。
kaldiio = { path = "compat/kaldiio" }
# OpenCL拡張は公開リポジトリへ含めるローカルnative packageから再現可能にビルドする。
coeiroink-opencl = [
    { path = "native/opencl", extra = "opencl" },
]
# CPUとOpenCLはCPU wheel、CUDAはcu128 wheelを同じPyTorchバージョンから解決する。
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "opencl" },
    { index = "pytorch-cu128", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "opencl" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[tool.uv.extra-build-dependencies]
# C++拡張のABI不一致を避けるため、OpenCL拡張を実行時に選択されたTorchと同じバージョンでビルドする。
coeiroink-opencl = [
    { requirement = "torch", match-runtime = true },
]

[[tool.uv.dependency-metadata]]
name = "coeiroink-opencl"
version = "0.1.3+coeiroink.1.7.3"
# backend別Torchは親extraで固定済みなので、ローカルpackageの重複要件をlock解決へ持ち込まない。
requires-dist = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools]
license-files = ["LICENSE", "licenses/GPL-3.0.txt"]

[tool.setuptools.packages.find]
where = ["src"]
