[build-system]
requires = [
    "setuptools>=73,<74",
    "wheel>=0.45,<1",
]
build-backend = "setuptools.build_meta"

[project]
name = "coeirocore"
version = "0.2.0+coeiroink.1.7.3"
description = "COEIROINK Core synthesis library"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "shirowanisan" }]
urls = { Homepage = "https://github.com/cyrne1-7208/coeiroink_core" }
dependencies = [
    # 既存のMYCOEIROINKモデルで使われる、ESPnetのjaconvテキストクリーナー。
    "jaconv>=0.4,<1",
    # ESPnetのjaconvクリーナーが読み込むtacotron_cleanerを提供する。
    "espnet-tts-frontend>=0.0.3,<1",
    "numba>=0.67,<0.68",
    "numpy>=2.3,<2.4",
    "pyopenjtalk @ git+https://github.com/r9y9/pyopenjtalk.git@v0.4.1",
    "pydantic>=2.13,<3",
    "psutil>=7.2,<8",
    "pyworld>=0.3.5,<0.4",
    "pyyaml>=6.0.1,<7",
    "resampy>=0.4.3,<1",
]

[project.optional-dependencies]
# バックエンドごとにPyTorchのwheelが異なるため、extraは一つだけ選択する。
cpu = [
    "espnet @ git+https://github.com/espnet/espnet.git@v.202609",
    # CPUでの周期検出結果を変えないため、バージョンを固定する。
    "praat-parselmouth==0.4.7",
    "scipy>=1.16,<2",
    "torch==2.10.0",
    "torchaudio==2.10.0",
]
cuda = [
    "espnet @ git+https://github.com/espnet/espnet.git@v.202609",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    # CUDA版の音声補正も同じGPU上で実行するためのCUDA 12系バインディング。
    "cupy-cuda12x==14.2.0",
]
directml = [
    # torch-directmlのWindows wheelに合わせ、DirectMLではTorch 2.4.1を使用する。
    "espnet @ git+https://github.com/espnet/espnet.git@v.202609 ; sys_platform == 'win32'",
    "praat-parselmouth==0.4.7; sys_platform == 'win32'",
    "scipy>=1.16,<2; sys_platform == 'win32'",
    "torch==2.4.1; sys_platform == 'win32'",
    "torchaudio==2.4.1; sys_platform == 'win32'",
    "torch-directml==0.2.5.dev240914; sys_platform == 'win32'",
]
opencl = [
    # OpenCLは、LinuxでCUDAを利用できないGPU向けのPrivateUse1バックエンドとして導入する。
    "coeiroink-opencl==0.2.0+coeiroink.1.7.3; sys_platform == 'linux'",
    "espnet @ git+https://github.com/espnet/espnet.git@v.202609 ; sys_platform == 'linux'",
    # TorchのABI解決を親extraへ集約するため、依存情報が空のネイティブパッケージとは別にPythonバインディングを指定する。
    "pyopencl>=2026.1.2,<2027; sys_platform == 'linux'",
    "torch==2.10.0; sys_platform == 'linux'",
    "torchaudio==2.10.0; sys_platform == 'linux'",
]
soxr = [
    # 高品質リサンプリングを明示的に選択した環境にのみ導入する。
    "soxr==1.1.0",
]
[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    # 実モデル合成テストが生成波形を検査するために直接使用する。
    "soundfile>=0.14,<1",
]
[tool.uv]
default-groups = []
# 異なるバックエンドのwheelが同じ環境に入らないよう、各extraを同時に指定できない設定にする。
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
    [
        { extra = "cpu" },
        { extra = "directml" },
    ],
    [
        { extra = "cpu" },
        { extra = "opencl" },
    ],
    [
        { extra = "cuda" },
        { extra = "directml" },
    ],
    [
        { extra = "cuda" },
        { extra = "opencl" },
    ],
    [
        { extra = "directml" },
        { extra = "opencl" },
    ],
]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
# OpenCL拡張は、リポジトリ内のネイティブパッケージから再現可能な形でビルドする。
coeiroink-opencl = [
    { path = "native/opencl", extra = "opencl" },
]
# CPUとOpenCLはCPU wheel、CUDAはcu128 wheelを同じPyTorchバージョンから解決する。
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "opencl" },
    { index = "pytorch-cu128", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "opencl" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[tool.uv.extra-build-dependencies]
# C++拡張のABI不一致を避けるため、OpenCL拡張を実行時に選択されたTorchと同じバージョンでビルドする。
coeiroink-opencl = [
    { requirement = "torch", match-runtime = true },
]

[[tool.uv.dependency-metadata]]
name = "coeiroink-opencl"
version = "0.2.0+coeiroink.1.7.3"
# Torchのバージョンは親のextraで固定しているため、ローカルパッケージ側では重ねて指定しない。
requires-dist = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools]
license-files = ["LICENSE", "licenses/GPL-3.0.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coeirocore = ["voice_smoothing_kernels/*.cl", "voice_smoothing_kernels/*.h"]
