[build-system]
requires = [
  "scikit-build-core>=0.11,<0.12",
  "pybind11>=3,<4",
  # pt_oclはPyTorchのC++ ABIへリンクするため、ビルド時と実行時で同じバージョンを使う。
  "torch==2.14.1",
]
build-backend = "scikit_build_core.build"

[project]
name = "coeiroink-opencl"
version = "0.2.2+coeiroink.1.7.3"
description = "OpenCL PrivateUse1 backend for COEIROINK Core"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pyopencl>=2026.1.2,<2027",
  "torch==2.14.1",
]
license = "LGPL-3.0-only"
license-files = [
  "LICENSE",
  "licenses/GPL-3.0.txt",
  "licenses/pytorch_dlprim/LICENSE",
  "licenses/dlprimitives/LICENSE",
]

[tool.scikit-build]
cmake.version = ">=3.31,<4"
ninja.version = ">=1.11"
sdist.include = [
  "CMakeLists.txt",
  "LICENSE",
  "licenses/GPL-3.0.txt",
  "licenses/pytorch_dlprim/LICENSE",
  "licenses/dlprimitives/LICENSE",
  "README.md",
  "patches/dlprimitives-opencl.patch",
  "python/pytorch_ocl/__init__.py",
  "src/vits_ops.cpp",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
