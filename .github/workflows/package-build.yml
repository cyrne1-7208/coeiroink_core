name: Core package and backend checks

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "検証するバックエンド。allは全環境を順番に実行します。"
        required: true
        type: choice
        default: cpu
        options:
          - cpu
          - cuda
          - opencl
          - directml
          - all

permissions:
  contents: read

concurrency:
  group: core-package-${{ github.ref }}-${{ inputs.backend }}
  cancel-in-progress: true

jobs:
  package:
    name: Build platform-independent Core package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.14"
          enable-cache: "true"

      - name: Validate uv.lock
        run: uv lock --check

      - name: Install build dependencies
        run: uv sync --locked --extra cpu --group build

      - name: Build wheel and source archive once
        run: uv build --wheel --sdist --out-dir dist

      - name: Upload Core package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coeiroink-core-package
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  select-target:
    name: Select backend environments
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Create the selected matrix
        id: matrix
        env:
          BACKEND: ${{ inputs.backend }}
        run: |
          set -euo pipefail
          case "$BACKEND" in
            cpu)
              matrix='{"include":[{"target":"linux-cpu","runner":"ubuntu-24.04","python":"3.14","extra":"cpu"},{"target":"windows-cpu","runner":"windows-2022","python":"3.14","extra":"cpu"}]}' ;;
            cuda)
              matrix='{"include":[{"target":"linux-cuda","runner":"ubuntu-24.04","python":"3.14","extra":"cuda"},{"target":"windows-cuda","runner":"windows-2022","python":"3.14","extra":"cuda"}]}' ;;
            opencl)
              matrix='{"include":[{"target":"linux-opencl","runner":"ubuntu-24.04","python":"3.14","extra":"opencl"}]}' ;;
            directml)
              matrix='{"include":[{"target":"windows-directml","runner":"windows-2022","python":"3.12","extra":"directml"}]}' ;;
            all)
              matrix='{"include":[{"target":"linux-cpu","runner":"ubuntu-24.04","python":"3.14","extra":"cpu"},{"target":"windows-cpu","runner":"windows-2022","python":"3.14","extra":"cpu"},{"target":"linux-cuda","runner":"ubuntu-24.04","python":"3.14","extra":"cuda"},{"target":"windows-cuda","runner":"windows-2022","python":"3.14","extra":"cuda"},{"target":"linux-opencl","runner":"ubuntu-24.04","python":"3.14","extra":"opencl"},{"target":"windows-directml","runner":"windows-2022","python":"3.12","extra":"directml"}]}' ;;
            *)
              echo "unknown backend: $BACKEND" >&2
              exit 2 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  backend-check:
    name: Check ${{ matrix.target }} dependencies
    needs: select-target
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select-target.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Check backend environment
        uses: ./.github/actions/backend-package-check
        with:
          backend: ${{ matrix.extra }}
          python-version: ${{ matrix.python }}
